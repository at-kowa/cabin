  <title>CABIN</title>
  <script>
  /* 起動診断（常設）：5秒経っても画面が出ない場合、原因を表示する */
  (function(){
    var buf=[];
    function cap(m){ if(buf.length<10) buf.push(m); }
    window.addEventListener('error', function(e){
      cap('[error] '+(e.message||'')+(e.filename?(' @ '+String(e.filename).slice(0,80)+':'+(e.lineno||0)):''));
    });
    window.addEventListener('unhandledrejection', function(e){
      var r=e.reason; cap('[promise] '+((r&&r.message)?r.message:String(r)));
    });
    setTimeout(function(){
      var root=document.getElementById('root');
      if(root && root.children.length>0) return;            /* アプリ描画済み */
      if(document.getElementById('cabin-login')) return;     /* ログイン画面表示済み */
      var imOk = (typeof HTMLScriptElement!=='undefined' && HTMLScriptElement.supports) ? HTMLScriptElement.supports('importmap') : false;
      var d=document.createElement('div');
      d.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;color:#333;font-family:sans-serif;padding:20px;overflow:auto;-webkit-user-select:text;user-select:text;';
      var advice = imOk
        ? '通信環境をご確認のうえ、下のボタンで再読み込みしてください。直らない場合はこの画面を撮影して松前までお知らせください。'
        : 'お使いのiPhone/iPadのiOSが古い可能性があります（iOS 16.4以上が必要）。「設定 → 一般 → ソフトウェアアップデート」で更新してください。';
      d.innerHTML =
        '<div style="max-width:480px;margin:0 auto">'+
        '<div style="font-size:18px;font-weight:700;margin:16px 0 8px">⚠️ アプリを起動できませんでした</div>'+
        '<div style="font-size:14px;line-height:1.7;color:#555">'+advice+'</div>'+
        '<button onclick="location.reload(true)" style="margin:16px 0;padding:12px 24px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:600">再読み込み</button>'+
        '<div style="font-size:11px;color:#999;white-space:pre-wrap;border-top:1px solid #eee;padding-top:10px">'+
        'importmap対応: '+imOk+'\n'+
        (buf.length?buf.join('\n'):'(JSエラーなし → 読み込み/ネットワークの可能性)')+'\n'+
        'UA: '+navigator.userAgent+'</div></div>';
      (document.body||document.documentElement).appendChild(d);
    }, 5000);
  })();
  </script>

<body class="bg-gray-50">
  <div id="root"></div>
  <script type="module">
    // === CABIN 会社版 ログインの門 ===
    // 1) 初回用リンク(#setup=)で接続先を受け取り、ブラウザに保存する（コードには書かない）
    // 2) 1人1アカウントでログイン（IDは member01 のように @ 以下を省略してよい）
    // 3) 初回はパスワード変更を必須にする（user_metadata.pw_changed）
    // 4) cabin_members で自分のメンバーIDを引き、users から本人を決めてアプリ本体(@/index)を起動
    var CFG_KEY = 'cabin.cfg';
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

    var m = location.hash.match(/setup=([A-Za-z0-9_-]+)/);
    if (m) {
      try {
        var j = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
        if (j.u && j.k) lsSet(CFG_KEY, JSON.stringify({ u: j.u, k: j.k }));
      } catch (e) {}
      history.replaceState(null, '', location.pathname + location.search);
    }

    var INPUT = 'width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:10px;font-size:14px';
    var BTN = 'width:100%;padding:11px;background:#16a34a;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer';
    function card(title, sub, inner) {
      var rootEl = document.getElementById('root');
      if (rootEl) rootEl.innerHTML = '';
      var old = document.getElementById('cabin-gate'); if (old) old.remove();
      var wrap = document.createElement('div');
      wrap.id = 'cabin-gate';
      wrap.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f9fafb;font-family:system-ui,sans-serif;z-index:99999';
      wrap.innerHTML =
        '<form id="cabin-login" style="background:#fff;padding:28px 24px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);width:320px;max-width:90vw">' +
          '<div style="font-size:20px;font-weight:700;margin-bottom:4px">' + title + '</div>' +
          '<div style="font-size:12px;color:#6b7280;margin-bottom:16px;line-height:1.6">' + sub + '</div>' +
          inner +
          '<div id="cabin-err" style="color:#dc2626;font-size:12px;margin-top:10px;min-height:16px"></div>' +
        '</form>';
      document.body.appendChild(wrap);
      return wrap;
    }
    function busy(wrap, on, label) {
      var b = wrap.querySelector('button[type=submit]');
      if (b) { b.disabled = on; b.textContent = on ? '確認中...' : label; }
    }

    if (!lsGet(CFG_KEY)) {
      card('CABIN', 'はじめての方は、配布された<b>「初回用のリンク」</b>から一度開いてください。<br>2回目からは、このページを直接開けます。', '');
    } else {
      var supabase = null;
      try {
        supabase = (await import('@/supabaseClient')).supabase;
      } catch (e) {
        card('CABIN', '接続の設定を読み込めませんでした。「初回用のリンク」から開き直してください。', '');
      }

      window.cabinLogout = async function () {
        try { await supabase.auth.signOut(); } catch (e) {}
        lsDel('rd_current_user');
        location.reload();
      };

      function showLogin(message) {
        var wrap = card('CABIN ログイン', '配られたログインID（例：member01）とパスワードを入力してください',
          '<input id="cabin-id" type="text" placeholder="ログインID" autocomplete="username" autocapitalize="off" style="' + INPUT + '">' +
          '<input id="cabin-pass" type="password" placeholder="パスワード" autocomplete="current-password" style="' + INPUT + '">' +
          '<button type="submit" style="' + BTN + '">ログイン</button>');
        var errEl = wrap.querySelector('#cabin-err');
        if (message) errEl.textContent = message;
        wrap.querySelector('form').addEventListener('submit', async function (e) {
          e.preventDefault();
          busy(wrap, true); errEl.textContent = '';
          var id = wrap.querySelector('#cabin-id').value.trim().toLowerCase();
          if (id && id.indexOf('@') < 0) id += '@cabin.local';
          var res = await supabase.auth.signInWithPassword({ email: id, password: wrap.querySelector('#cabin-pass').value });
          if (res.error) { errEl.textContent = 'ログインに失敗しました（ID／パスワードをご確認ください）'; busy(wrap, false, 'ログイン'); return; }
          location.reload();
        });
      }

      function showChangePassword(user) {
        var wrap = card('パスワードの変更', 'はじめてのログインです。<br>あなただけのパスワード（8文字以上）に変更してください。',
          '<input id="cabin-new1" type="password" placeholder="新しいパスワード" autocomplete="new-password" style="' + INPUT + '">' +
          '<input id="cabin-new2" type="password" placeholder="もう一度入力" autocomplete="new-password" style="' + INPUT + '">' +
          '<button type="submit" style="' + BTN + '">変更して開く</button>' +
          '<button type="button" id="cabin-out" style="width:100%;margin-top:8px;padding:8px;background:none;border:0;color:#6b7280;font-size:12px;cursor:pointer">ログアウト</button>');
        var errEl = wrap.querySelector('#cabin-err');
        wrap.querySelector('#cabin-out').addEventListener('click', function () { window.cabinLogout(); });
        wrap.querySelector('form').addEventListener('submit', async function (e) {
          e.preventDefault();
          var p1 = wrap.querySelector('#cabin-new1').value, p2 = wrap.querySelector('#cabin-new2').value;
          if (p1.length < 8) { errEl.textContent = '8文字以上にしてください'; return; }
          if (p1 !== p2) { errEl.textContent = '2つの入力が一致しません'; return; }
          busy(wrap, true); errEl.textContent = '';
          var res = await supabase.auth.updateUser({ password: p1, data: { pw_changed: true } });
          if (res.error) {
            errEl.textContent = /same|different/i.test(res.error.message || '') ? '今のパスワードとは違うものにしてください' : '変更できませんでした（' + (res.error.message || '') + '）';
            busy(wrap, false, '変更して開く'); return;
          }
          location.reload();
        });
      }

      function showStop(message) {
        var wrap = card('CABIN', message,
          '<button type="button" id="cabin-out" style="' + BTN + '">ログアウト</button>');
        wrap.querySelector('#cabin-out').addEventListener('click', function () { window.cabinLogout(); });
      }

      if (supabase) {
        try {
          var s = await supabase.auth.getSession();
          var session = s && s.data && s.data.session;
          if (!session) {
            showLogin('');
          } else if (!(session.user.user_metadata && session.user.user_metadata.pw_changed)) {
            showChangePassword(session.user);
          } else {
            var mem = await supabase.from('cabin_members').select('member_id').eq('user_id', session.user.id).maybeSingle();
            var memberId = mem.data && mem.data.member_id;
            if (!memberId) {
              showStop('このIDはCABINのメンバーに登録されていません。管理者にお知らせください。');
            } else {
              var us = await supabase.from('rd_nexus_store').select('value').eq('key', 'users').maybeSingle();
              var list = (us.data && Array.isArray(us.data.value)) ? us.data.value : [];
              var me = list.find(function (u) { return u.id === memberId; });
              if (!me) {
                showStop('メンバー情報が見つかりません（' + memberId + '）。管理者にお知らせください。');
              } else {
                lsSet('rd_current_user', JSON.stringify(me));
                await import('@/index');
              }
            }
          }
        } catch (err) {
          showLogin('接続エラーが発生しました。時間をおいて再読み込みしてください。');
        }
      }
    }
  </script>
</body>
</html>
